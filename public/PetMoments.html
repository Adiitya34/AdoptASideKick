<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Pet Moments</title>
    <style>
        :root {
            --primary: #2E7D32;
            --secondary: #4CAF50;
            --accent: #81C784;
            --background: #F1F8E9;
            --text: #1B5E20;
            --card-bg: rgba(255, 255, 255, 0.7); /* Transparent background */
            --shadow: rgba(46, 125, 50, 0.1);
            --hover-shadow: rgba(46, 125, 50, 0.2);
            --transition: 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif; /* Cool font */
        }

        body {
            background: url('https://i.postimg.cc/2SdbmGqd/videoplayback-ezgif-com-video-to-gif-converter-3.gif') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav {
            background-color: var(--primary);
            padding: 1rem 2rem;
            box-shadow: 0 4px 12px var(--shadow);
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-transform: uppercase;
            transition: var(--transition);
        }

        nav a:hover {
            background-color: var(--secondary);
            transform: translateY(-4px);
            box-shadow: 0 4px 16px var(--hover-shadow);
        }

        main {
            max-width: 1200px;
            margin: 5rem auto 0;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            width: 100%;
        }

        .half-container {
            width: 50%;
            padding: 1.5rem;
            border-radius: 12px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 12px var(--shadow);
            transition: var(--transition);
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        .half-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px var(--hover-shadow);
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Lobster', cursive; /* Cool cursive font */
        }

        .gallery-embed a,
        .upload-link a {
            color: var(--primary);
            font-size: 1.2rem;
            text-decoration: none;
            font-weight: 500;
            border: 2px solid var(--primary);
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            display: block;
            margin-top: 2rem;
            text-align: center;
            transition: var(--transition);
        }

        .gallery-embed a:hover,
        .upload-link a:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 4px 12px var(--hover-shadow);
        }

        .gallery-embed a {
            background-color: var(--accent);
        }

        .upload-link a {
            background-color: var(--secondary);
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
                align-items: center;
            }

            .half-container {
                width: 100%;
                margin-bottom: 2rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

          /* Preloader Styles */
          @import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Rampart+One&family=Reem+Kufi+Ink&display=swap');

.preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #66CEFF;
    z-index: 9999;
    opacity: 1;
    transition: opacity 0.3s ease-in-out;
}

.preloader.hide {
    opacity: 0;
    pointer-events: none;
}

.preloader-content {
    text-align: center;
}

.preloader-image {
    width: 400px;
    height: auto;
}

.preloader-title {
    margin-top: 20px;
    color: #fff;
    font-size: 24px;
    font-family: 'Amatic SC', cursive;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.title {
    font-size: 24px;
    font-family: 'Amatic SC', cursive;
    letter-spacing: 2px;
}

@keyframes preloader-rotate {
    0% {
        transform: rotate(0);
    }
    100% {
        transform: rotate(360deg);
    }
}
    </style>
</head>
<body>
    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <img class="preloader-image" src="https://i.postimg.cc/4xjDMtms/cool-loading-animated-gif-1.gif" alt="Loading">
            <!-- <h2 class="preloader-title">Adopt A SideKick</h2> -->
        </div>
    </div>


    <nav>
        <ul>
            <li><a href="pet-moments.html">Snap the joy, share the love.</a></li>
        </ul>
    </nav>

    <main>
        <!-- Left Side: Upload the Moments -->
        <div class="half-container upload-link">
            <h1>Upload Your Pet Moments</h1>
            <a href="https://adityajaiswal.smugmug.com/upload/v3rjN8/petmoments" target="_blank">Upload Pet Moments</a>
        </div>

        <!-- Right Side: View Gallery -->
        <div class="half-container gallery-embed">
            <h1>View the Pet Moments Gallery</h1>
            <a href="https://adityajaiswal.smugmug.com/AdoptASideKick" target="_blank">Explore the Gallery</a>
        </div>
    </main>
    <script>
        setTimeout(function() {
            document.getElementById("preloader").classList.add("hide");
        }, 2300);
    </script>
</body>
</html>
